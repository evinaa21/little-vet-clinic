name: LittleVetClinic
options:
  bundleIdPrefix: com.littlevetclinic
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  LittleVetClinic:
    type: application
    platform: macOS
    sources:
      - path: LittleVetClinic
        excludes:
          - "Info.plist"
          - "LittleVetClinic.entitlements"
      - path: LittleVetClinic/Info.plist
        buildPhase: none
      - path: LittleVetClinic/LittleVetClinic.entitlements
        buildPhase: none
    preBuildScripts:
      # Keep PNG/WAV resources clean before they are copied into the bundle.
      - name: Strip source xattrs
        script: |
          export COPYFILE_DISABLE=1
          /usr/bin/xattr -cr "${SRCROOT}/LittleVetClinic/Resources" 2>/dev/null || true
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # Runs before CopySwiftLibs / CodeSign — use scripts/build.sh from VS Code for
      # a reliable sign. This pass still helps Xcode-only builds.
      - name: Strip extended attributes
        script: |
          APP="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          /usr/bin/xattr -cr "${APP}" 2>/dev/null || true
          find "${APP}" -name .DS_Store -delete 2>/dev/null || true
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: LittleVetClinic
        PRODUCT_BUNDLE_IDENTIFIER: com.littlevetclinic.LittleVetClinic
        INFOPLIST_FILE: LittleVetClinic/Info.plist
        CODE_SIGN_ENTITLEMENTS: LittleVetClinic/LittleVetClinic.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
